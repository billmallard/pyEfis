# AER-6288 (AFC4 live): the mode strip on a running pyEfis dev screen. The
# AFC2/AFC5 route, en route only, so the driver never commands the vertical
# axis after engaging. The bench sequencer (seq.py) presses HDG, offsets
# 40 deg right for 60 s, turns to a 30 deg intercept and arms NAV, then VS to
# ALTSEL 500 ft up, then an IAS climb to ALTSEL 500 ft up again, then DISC.
# The disconnect trips the servo guard and ends the session: expected, and it
# lets the private glass show the autopilot keys going old (NO AP DATA).
name: afc4-live-annunciator
destination: KSMX
departure: KSBA
start: {fix: HENER, before_nm: 3, alt_ft: 7500}
route:
  - waypoint: GVO
  - airway: {id: V27, exit: AVOLS}
end: {after_fix: DOYLE, max_s: 2100}
