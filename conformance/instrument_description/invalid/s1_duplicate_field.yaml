# Refused under S1: a field given twice; YAML would silently keep the last.
# Generated as valid/minimal.yaml with one change.

format: makerplane.instrument/1
type: user.minimal_dial
label: Minimal dial
label: Other dial
family: scale_gauge

options:
  - {name: dbkey, kind: fixkey, default: OILP1}

inputs:
  value: {option: dbkey}

canvas: {width: 100, height: 100}

scale:
  input: value
  range: {from: 0, to: 100}
  angle: {start: -135, sweep: 270}

draw:
  - pointer: {pivot: {x: 50, y: 50}, shape: [[-2, 5], [0, -40], [2, 5]], fill: ink.primary}
