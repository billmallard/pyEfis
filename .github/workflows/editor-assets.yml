name: editor-assets

# Phase 3 of docs/environments.md (section 6): a push that can change the editor
# schema regenerates schema.json + groups.json from THIS branch and uploads them to
# the branch's environment prefix on the makerplane-configs R2 bucket.
#   dev -> assets/editor/dev/ , qa -> assets/editor/qa/ , master -> assets/editor/ (prod, bare)
#
# SCOPE: schema.json + groups.json + palette/<type>.svg. The palette thumbnails are
# built by tools/build_editor_assets.py under QT_QPA_PLATFORM=offscreen with the
# DejaVu fonts (render_instrument.py registers them so text is not tofu); no xvfb.
# Only REAL renders are uploaded. A type the offscreen path cannot draw (GL / SVS /
# embedded-app widgets: virtual_vfr, weston, button, listbox today) gets a labelled
# placeholder from the build, and CI never uploads that placeholder, so it can never
# clobber a thumbnail someone generated by hand. The SVS preview patches
# (svs/<scene>.json|webp, which need local SRTM/NASR terrain data) stay LOCAL-gen:
# `python tools/export_svs_preview_patch.py`, then upload manually.
#
# SKIPS with a warning (stays green) until CLOUDFLARE_API_TOKEN (with R2 write on
# makerplane-configs) is set, so landing this file causes no red runs.
on:
  push:
    branches: [dev, qa, master]
    paths:
      - "src/pyefis/editor/**"
      - "src/pyefis/screens/screenbuilder_factory.py"
      - "src/pyefis/instruments/**"
      - "tools/build_editor_assets.py"
      - "tools/render_instrument.py"
      - ".github/workflows/editor-assets.yml"
  workflow_dispatch:

concurrency: editor-assets-${{ github.ref_name }}

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22" # wrangler 4 requires Node >= 22

      - name: Offscreen-Qt system deps
        run: |
          # Offscreen Qt needs libegl1 to import; the palette renders need the
          # DejaVu fonts (render_instrument.py loads them by path). Refresh the
          # apt index first (baked list can 404 on a rotated-off .deb).
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 fonts-dejavu-core
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - run: pip install -e .[qt,svs]

      - name: Generate schema.json + groups.json + palette/*.svg
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p work
          python tools/build_editor_assets.py --out work/editor_assets | tee work/build.log
          # Upload list = the types that rendered for real ("<type>  svg").
          awk '$2 == "svg" {print $1}' work/build.log > work/palette_real.txt
          echo "real renders: $(wc -l < work/palette_real.txt); placeholders (not uploaded):"
          awk '$2 == "placeholder" {print "  " $1}' work/build.log
          test -s work/palette_real.txt
          ls -l work/editor_assets work/editor_assets/palette

      - name: Map branch -> R2 prefix
        id: map
        run: |
          b="${{ github.ref_name }}"
          if   [ "$b" = dev ];    then p="assets/editor/dev/"
          elif [ "$b" = qa ];     then p="assets/editor/qa/"
          elif [ "$b" = master ]; then p="assets/editor/"
          else p=""; fi
          echo "prefix=$p" >> "$GITHUB_OUTPUT"

      - name: Upload schema + groups + palette to R2 (prefix=${{ steps.map.outputs.prefix }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREFIX: ${{ steps.map.outputs.prefix }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set - skipping upload. See docs/environments.md section 6."
            exit 0
          fi
          if [ -z "$PREFIX" ]; then
            echo "branch ${{ github.ref_name }} maps to no env prefix; nothing to upload."
            exit 0
          fi
          BUCKET=makerplane-configs
          for f in schema.json groups.json; do
            npx --yes wrangler@4 r2 object put "${BUCKET}/${PREFIX}${f}" \
              --file "work/editor_assets/${f}" \
              --content-type application/json --remote >/dev/null
            echo "  put ${PREFIX}${f}"
          done
          # </dev/null: npx must not eat the loop's stdin (the type list).
          n=0
          while read -r t; do
            npx --yes wrangler@4 r2 object put "${BUCKET}/${PREFIX}palette/${t}.svg" \
              --file "work/editor_assets/palette/${t}.svg" \
              --content-type image/svg+xml --remote >/dev/null </dev/null
            n=$((n + 1))
          done < work/palette_real.txt
          echo "uploaded schema.json + groups.json + ${n} palette/*.svg under ${PREFIX}"
