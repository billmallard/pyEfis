name: editor-assets

# Phase 3 of docs/environments.md (section 6): a push that can change the editor
# schema regenerates schema.json + groups.json from THIS branch and uploads them to
# the branch's environment prefix on the makerplane-configs R2 bucket.
#   dev -> assets/editor/dev/ , qa -> assets/editor/qa/ , master -> assets/editor/ (prod, bare)
#
# SCOPE: schema.json + groups.json ONLY. These are pure data (deterministic, no
# display needed). Palette thumbnails (palette/<type>.svg) are NOT built here --
# headless CI cannot render the Qt widgets to SVG (they come out as placeholders,
# which would clobber the real thumbnails in prod). Palette SVGs and the SVS preview
# patches (svs/<scene>.json|webp, which also need local SRTM/NASR terrain data) stay
# LOCAL-gen: regenerate with `python tools/build_editor_assets.py` on a machine with
# a display and `python tools/export_svs_preview_patch.py`, then upload manually.
# (Enabling headless palette rendering -- xvfb + QtSvg -- is a possible follow-up.)
#
# SKIPS with a warning (stays green) until CLOUDFLARE_API_TOKEN (with R2 write on
# makerplane-configs) is set, so landing this file causes no red runs.
on:
  push:
    branches: [dev, qa, master]
    paths:
      - "src/pyefis/editor/**"
      - "src/pyefis/screens/screenbuilder_factory.py"
      - ".github/workflows/editor-assets.yml"
  workflow_dispatch:

concurrency: editor-assets-${{ github.ref_name }}

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Offscreen-Qt system deps
        run: |
          # schema/groups are pure data, but importing the factory pulls Qt in;
          # libegl1 + offscreen keeps the import happy without a display. Refresh
          # the apt index first (baked list can 404 on a rotated-off .deb).
          sudo apt-get update
          sudo apt-get install -y libegl1
      - run: pip install -e .[qt,svs]

      - name: Generate schema.json + groups.json
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p work/editor_assets
          python -c "from pathlib import Path; from pyefis.editor import schema, groups; Path('work/editor_assets/schema.json').write_text(schema.to_json()+chr(10)); Path('work/editor_assets/groups.json').write_text(groups.to_json()+chr(10)); print('wrote schema.json + groups.json')"
          ls -l work/editor_assets

      - name: Map branch -> R2 prefix
        id: map
        run: |
          b="${{ github.ref_name }}"
          if   [ "$b" = dev ];    then p="assets/editor/dev/"
          elif [ "$b" = qa ];     then p="assets/editor/qa/"
          elif [ "$b" = master ]; then p="assets/editor/"
          else p=""; fi
          echo "prefix=$p" >> "$GITHUB_OUTPUT"

      - name: Upload schema + groups to R2 (prefix=${{ steps.map.outputs.prefix }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREFIX: ${{ steps.map.outputs.prefix }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set - skipping upload. See docs/environments.md section 6."
            exit 0
          fi
          if [ -z "$PREFIX" ]; then
            echo "branch ${{ github.ref_name }} maps to no env prefix; nothing to upload."
            exit 0
          fi
          BUCKET=makerplane-configs
          for f in schema.json groups.json; do
            npx --yes wrangler@4 r2 object put "${BUCKET}/${PREFIX}${f}" \
              --file "work/editor_assets/${f}" \
              --content-type application/json --remote >/dev/null
            echo "  put ${PREFIX}${f}"
          done
          echo "uploaded schema.json + groups.json under ${PREFIX}"
