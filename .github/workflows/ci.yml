# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "master", "dev", "qa" ]
  pull_request:


jobs:
  build:
    
    runs-on: ubuntu-latest
    permissions:
      # Needed to save data for comment
      pull-requests: write
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        # Refresh the apt index first: the runner's pre-baked package list can
        # reference a libegl1 dependency (.deb) that Ubuntu has since rotated off
        # the mirror, so a bare `apt install` 404s. `apt-get update` re-resolves it.
        sudo apt-get update
        sudo apt install -y libegl1
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-qt pytest-env pytest-cov
        pip install -e .[qt,svs,watertools]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src test --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      id: pytest
      run: |
        # JUnit (xunit1 keeps each case's file and line) is the record the job summary
        # and the test-evidence page are built from (TV11).
        pytest --junitxml=reports/junit.xml -o junit_family=xunit1

    - name: Test evidence record and job summary
      if: always() && steps.pytest.outcome != 'skipped'
      env:
        REF: ${{ github.head_ref || github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python tools/verification_report.py collect --junit reports/junit.xml --tests tests \
          --docs docs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --ref "$REF" \
          --run-url "$RUN_URL" --out reports/verification.json
        python tools/verification_report.py summary reports/verification.json >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the test results
      if: always() && steps.pytest.outcome != 'skipped'
      uses: actions/upload-artifact@v6
      with:
        name: test-results
        path: |
          reports/junit.xml
          reports/verification.json
        retention-days: 90

    - name: Coverage comment
      id: coverage_comment
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        
    - name: Store Pull Request comment to be posted
      uses: actions/upload-artifact@v6
      if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
      with:
        # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
        name: python-coverage-comment-action
        # If you use a different name, update COMMENT_FILENAME accordingly
        path: python-coverage-comment-action.txt

  # TV11: render the test-evidence page from this run's record plus fix-gateway's latest
  # dev record, and deploy it to Cloudflare Pages. dev is the production branch; every
  # other branch gets its own preview URL. A separate job so a Pages outage can never
  # fail the required `build` check.
  evidence-page:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: evidence-page-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      # The same token editor-assets.yml uses; Bill added Pages Edit to it (AER-4151).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: avionics-test-evidence
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # the evidence index names the commit that added each directory (TV12)
    - uses: actions/download-artifact@v6
      continue-on-error: true
      with:
        name: test-results
        path: records/pyefis
    - name: Fetch fix-gateway's latest dev record
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id=$(gh run list -R billmallard/fix-gateway -w CI -b dev --status completed -L 10 \
          --json databaseId,conclusion -q '[.[] | select(.conclusion != "cancelled")][0].databaseId')
        if [ -n "$run_id" ]; then
          gh run download "$run_id" -R billmallard/fix-gateway -n test-results -D records/fgw
        fi
    - name: Render the page
      run: |
        mkdir -p records/pyefis records/fgw
        records=""
        [ -f records/pyefis/verification.json ] && records="$records records/pyefis/verification.json"
        [ -f records/fgw/verification.json ] && records="$records records/fgw/verification.json"
        python tools/verification_report.py page $records --expect pyEfis fix-gateway --out site
    - name: Render the evidence index
      run: |
        # TV12: every committed evidence image and what its sidecar says, as evidence.html.
        # A broken sidecar fails the build job's tests, not this deploy.
        python tools/evidence_index.py --html site/evidence.html \
          --repo "$GITHUB_REPOSITORY" --sha "${{ github.event.pull_request.head.sha || github.sha }}"
    - uses: actions/upload-artifact@v6
      with:
        name: evidence-page
        path: site/
    - uses: actions/setup-node@v5
      if: env.CLOUDFLARE_API_TOKEN != ''
      with:
        node-version: "22" # wrangler 4 requires Node >= 22
    - name: Deploy to Cloudflare Pages
      if: env.CLOUDFLARE_API_TOKEN != ''
      run: |
        npx --yes wrangler@4 pages project list | grep -q "$PAGES_PROJECT" || \
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch dev
        npx --yes wrangler@4 pages deploy site --project-name "$PAGES_PROJECT" \
          --branch "$BRANCH" --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}"
    - name: Attach the custom domain (dev only, idempotent)
      if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push' && env.BRANCH == 'dev'
      shell: bash # -eo pipefail, so a failed curl in a pipe fails the step
      env:
        DOMAIN: testing.aerocommons.org
      run: |
        # A Pages API call only: the token has Pages Edit and deliberately no DNS rights,
        # so the one DNS record for DOMAIN is made outside CI. This step attaches the
        # domain if it is not attached yet and prints what Cloudflare reports for it.
        api=https://api.cloudflare.com/client/v4
        auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
        proj="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
        if [ "$(curl -sS "${auth[@]}" "$proj/domains/$DOMAIN" | jq -r .success)" != "true" ]; then
          curl -sS --fail-with-body "${auth[@]}" -X POST "$proj/domains" -d "{\"name\":\"$DOMAIN\"}" \
            | jq -c '.result | {name, status}'
        fi
        curl -sS --fail-with-body "${auth[@]}" "$proj/domains/$DOMAIN" \
          | jq -c '.result | {name, status, verification_data, validation_data}'
    - name: No deploy token
      if: env.CLOUDFLARE_API_TOKEN == ''
      run: echo "::notice::CLOUDFLARE_API_TOKEN is not available to this run; the page was built, not deployed"

  # TV12: each qa -> master promotion (a push to master) gets a GitHub Release carrying
  # that commit's test report: the job summary as the notes, the JSON and JUnit records,
  # and the rendered evidence site as a zip. A red promotion still gets its release, as
  # a pre-release that says so, so the record is never missing. Separate job: a Release
  # API failure cannot fail the required `build` check.
  release:
    needs: [build, evidence-page]
    if: >-
      always() && github.event_name == 'push' && github.ref_name == 'master'
      && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v6
      with:
        name: test-results
        path: records
    - uses: actions/download-artifact@v6
      continue-on-error: true
      with:
        name: evidence-page
        path: site
    - name: Create the release (once per commit)
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RESULT: ${{ needs.build.result }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        short=${GITHUB_SHA::7}
        tag="promotion-$short"
        if gh release view "$tag" >/dev/null 2>&1; then
          echo "::notice::$tag already exists; not re-creating it"
          exit 0
        fi
        assets="records/verification.json records/junit.xml"
        if [ -f site/index.html ]; then
          (cd site && python -m zipfile -c ../evidence-site.zip *) && assets="$assets evidence-site.zip"
        fi
        {
          echo "Promotion of \`qa\` to \`master\` at $GITHUB_SHA ([CI run]($RUN_URL))."
          echo
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "**The test run for this commit did not pass.** It is published as a pre-release so the record exists; see the failing tests below."
            echo
          fi
          echo "Attached: \`verification.json\` and \`junit.xml\`, the test records."
          if [ -f evidence-site.zip ]; then
            echo "\`evidence-site.zip\` is the test-evidence page and the evidence-image index as rendered for this commit."
          else
            echo "The evidence-page job left no site for this run, so no \`evidence-site.zip\` is attached."
          fi
          echo
          python tools/verification_report.py summary records/verification.json
        } > notes.md
        if [ "$(wc -c < notes.md)" -gt 120000 ]; then
          head -c 118000 notes.md > notes.cut
          printf '\n\n_Report truncated to fit a release body; the full record is verification.json._\n' >> notes.cut
          mv notes.cut notes.md
        fi
        flags=""
        [ "$BUILD_RESULT" = "success" ] || flags="--prerelease"
        gh release create "$tag" --target "$GITHUB_SHA" $flags \
          --title "Promotion $(date -u +%Y-%m-%d) ($short)" --notes-file notes.md $assets
