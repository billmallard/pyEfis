# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "master", "dev", "qa" ]
  pull_request:
  # weekly.yml dispatches this on dev (see there).
  workflow_dispatch:


jobs:
  build:
    
    runs-on: ubuntu-latest
    permissions:
      # Needed to save data for comment
      pull-requests: write
      contents: write
    steps:
    - uses: actions/checkout@v6
    # G61a: tests/flightplan/test_refusal.py reads the engine's source and fails when
    # it can publish an FPLMSG refusal code the display has no plain words for.
    - name: Check out fix-gateway's flightplan engine
      uses: actions/checkout@v6
      with:
        repository: billmallard/fix-gateway
        ref: dev
        path: _fixgw
        sparse-checkout: src/fixgw/plugins/flightplan/engine.py
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        # Refresh the apt index first: the runner's pre-baked package list can
        # reference a libegl1 dependency (.deb) that Ubuntu has since rotated off
        # the mirror, so a bare `apt install` 404s. `apt-get update` re-resolves it.
        sudo apt-get update
        sudo apt install -y libegl1
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-qt pytest-env pytest-cov
        pip install -e .[qt,svs,watertools]
        # CERT7: the environment the tests ran in, so a promotion's lock file can be
        # checked against it.
        mkdir -p reports && pip freeze > reports/tested-env.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src test --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      id: pytest
      env:
        FIXGW_FLIGHTPLAN_ENGINE: _fixgw/src/fixgw/plugins/flightplan/engine.py
      run: |
        # JUnit (xunit1 keeps each case's file and line) is the record the job summary
        # and the test-evidence page are built from (TV11).
        pytest --junitxml=reports/junit.xml -o junit_family=xunit1

    - name: Test evidence record and job summary
      if: always() && steps.pytest.outcome != 'skipped'
      env:
        REF: ${{ github.head_ref || github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python tools/verification_report.py collect --junit reports/junit.xml --tests tests \
          --docs docs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --ref "$REF" \
          --run-url "$RUN_URL" --out reports/verification.json
        python tools/verification_report.py summary reports/verification.json >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the test results
      if: always() && steps.pytest.outcome != 'skipped'
      uses: actions/upload-artifact@v6
      with:
        name: test-results
        path: |
          reports/junit.xml
          reports/verification.json
          reports/tested-env.txt
        retention-days: 90

    - name: Coverage comment
      id: coverage_comment
      # A dispatched run has no PR to comment on and is not the badge source.
      if: github.event_name != 'workflow_dispatch'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        
    - name: Store Pull Request comment to be posted
      uses: actions/upload-artifact@v6
      if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
      with:
        # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
        name: python-coverage-comment-action
        # If you use a different name, update COMMENT_FILENAME accordingly
        path: python-coverage-comment-action.txt

  # TV11: render the test-evidence page from this run's record plus fix-gateway's latest
  # dev record, and deploy it to Cloudflare Pages. dev is the production branch; every
  # other branch gets its own preview URL. A separate job so a Pages outage can never
  # fail the required `build` check.
  evidence-page:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: evidence-page-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      # The same token editor-assets.yml uses; Bill added Pages Edit to it (AER-4151).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: avionics-test-evidence
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # the evidence index names the commit that added each directory (TV12)
    - uses: actions/download-artifact@v6
      continue-on-error: true
      with:
        name: test-results
        path: records/pyefis
    - name: Fetch fix-gateway's latest dev record
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id=$(gh run list -R billmallard/fix-gateway -w CI -b dev --status completed -L 10 \
          --json databaseId,conclusion -q '[.[] | select(.conclusion != "cancelled")][0].databaseId')
        if [ -n "$run_id" ]; then
          gh run download "$run_id" -R billmallard/fix-gateway -n test-results -D records/fgw
        fi
    - name: Render the page
      run: |
        mkdir -p records/pyefis records/fgw
        records=""
        [ -f records/pyefis/verification.json ] && records="$records records/pyefis/verification.json"
        [ -f records/fgw/verification.json ] && records="$records records/fgw/verification.json"
        python tools/verification_report.py page $records --expect pyEfis fix-gateway --out site
    - name: Render the evidence index
      run: |
        # TV12: every committed evidence image and what its sidecar says, as evidence.html.
        # A broken sidecar fails the build job's tests, not this deploy.
        python tools/evidence_index.py --html site/evidence.html \
          --repo "$GITHUB_REPOSITORY" --sha "${{ github.event.pull_request.head.sha || github.sha }}"
    - uses: actions/upload-artifact@v6
      with:
        name: evidence-page
        path: site/
    - uses: actions/setup-node@v5
      if: env.CLOUDFLARE_API_TOKEN != ''
      with:
        node-version: "22" # wrangler 4 requires Node >= 22
    - name: Deploy to Cloudflare Pages
      if: env.CLOUDFLARE_API_TOKEN != ''
      run: |
        npx --yes wrangler@4 pages project list | grep -q "$PAGES_PROJECT" || \
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch dev
        npx --yes wrangler@4 pages deploy site --project-name "$PAGES_PROJECT" \
          --branch "$BRANCH" --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}"
    - name: Attach the custom domain (dev only, idempotent)
      if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push' && env.BRANCH == 'dev'
      shell: bash # -eo pipefail, so a failed curl in a pipe fails the step
      env:
        DOMAIN: testing.aerocommons.org
      run: |
        # A Pages API call only: the token has Pages Edit and deliberately no DNS rights,
        # so the one DNS record for DOMAIN is made outside CI. This step attaches the
        # domain if it is not attached yet and prints what Cloudflare reports for it.
        api=https://api.cloudflare.com/client/v4
        auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
        proj="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
        if [ "$(curl -sS "${auth[@]}" "$proj/domains/$DOMAIN" | jq -r .success)" != "true" ]; then
          curl -sS --fail-with-body "${auth[@]}" -X POST "$proj/domains" -d "{\"name\":\"$DOMAIN\"}" \
            | jq -c '.result | {name, status}'
        fi
        curl -sS --fail-with-body "${auth[@]}" "$proj/domains/$DOMAIN" \
          | jq -c '.result | {name, status, verification_data, validation_data}'
    - name: No deploy token
      if: env.CLOUDFLARE_API_TOKEN == ''
      run: echo "::notice::CLOUDFLARE_API_TOKEN is not available to this run; the page was built, not deployed"

  # TV12 + CERT7: each qa -> master promotion (a push to master) is a flown baseline.
  # The commit gets an annotated tag, baseline-YYYY-MM-DD, whose message names the
  # fix-gateway baseline it flies with, and a GitHub Release carrying: the commit's test
  # report (the job summary as the notes, the JSON and JUnit records, the rendered
  # evidence site as a zip), the resolved lock file and CycloneDX SBOM of what flies, and
  # the open safety problems in both repos. A red promotion still gets its tag and
  # release, as a pre-release that says so, so the record is never missing. Separate
  # job: a Release API failure cannot fail the required `build` check. The lookups are
  # tools/flown_baseline.py; the procedure is docs/evidence.md, "Releases".
  release:
    needs: [build, evidence-page]
    if: >-
      always() && github.event_name == 'push' && github.ref_name == 'master'
      && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RESULT: ${{ needs.build.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OTHER_REPO: billmallard/fix-gateway
      # What flies: the runtime extras. watertools is build-time only (pyproject.toml).
      FLOWN: ".[qt,svs]"
      PACKAGE: pyefis
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/download-artifact@v6
      with:
        name: test-results
        path: records
    - uses: actions/download-artifact@v6
      continue-on-error: true
      with:
        name: evidence-page
        path: site
    - name: Find this commit's baseline, if a re-run
      id: tag
      run: |
        # One baseline per commit. A re-run reuses the tag it already cut, and stops if
        # the release exists too.
        tag=$(git ls-remote --tags origin 'refs/tags/baseline-*' \
          | awk -v s="$GITHUB_SHA" '$1 == s && index($2, "^{}") {n = substr($2, 11); print substr(n, 1, length(n) - 3); exit}')
        if [ -n "$tag" ] && gh release view "$tag" >/dev/null 2>&1; then
          echo "::notice::$tag is already released; not re-creating it"
          echo "released=true" >> "$GITHUB_OUTPUT"
        fi
        echo "existing=$tag" >> "$GITHUB_OUTPUT"
    - name: Resolved lock file and SBOM of what flies
      if: steps.tag.outputs.released != 'true'
      run: |
        python -m venv "$RUNNER_TEMP/flown"
        "$RUNNER_TEMP/flown/bin/pip" install --upgrade pip
        "$RUNNER_TEMP/flown/bin/pip" install "$FLOWN"
        "$RUNNER_TEMP/flown/bin/pip" freeze --exclude "$PACKAGE" > requirements-flown.lock.txt
        # The SBOM tool lives in its own venv so it is not in the inventory it takes.
        python -m venv "$RUNNER_TEMP/sbom"
        "$RUNNER_TEMP/sbom/bin/pip" install cyclonedx-bom==8.0.1
        "$RUNNER_TEMP/sbom/bin/cyclonedx-py" environment -E --pyproject pyproject.toml \
          --mc-type application --of JSON -o sbom.cdx.json "$RUNNER_TEMP/flown/bin/python"
    - name: Tag the baseline
      if: steps.tag.outputs.released != 'true'
      id: cut
      env:
        EXISTING: ${{ steps.tag.outputs.existing }}
      run: |
        if [ -n "$EXISTING" ]; then
          echo "name=$EXISTING" >> "$GITHUB_OUTPUT"
          git fetch -q origin "refs/tags/$EXISTING:refs/tags/$EXISTING"
          git tag -l --format='%(contents)' "$EXISTING" | sed -n '3p' > pair.txt
          exit 0
        fi
        name=$(python tools/flown_baseline.py name --repo "$GITHUB_REPOSITORY" --date "$(date -u +%F)")
        python tools/flown_baseline.py pair --other "$OTHER_REPO" --name "$name" > pair.txt
        {
          echo "Flown baseline $name: $GITHUB_REPOSITORY at $GITHUB_SHA."
          echo
          cat pair.txt
          echo
          echo "Tests: $BUILD_RESULT ($RUN_URL)."
        } > tag-message.txt
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$name" "$GITHUB_SHA" -F tag-message.txt
        git push origin "refs/tags/$name"
        echo "name=$name" >> "$GITHUB_OUTPUT"
    - name: Create the release
      if: steps.tag.outputs.released != 'true'
      env:
        TAG: ${{ steps.cut.outputs.name }}
      run: |
        short=${GITHUB_SHA::7}
        assets="records/verification.json records/junit.xml requirements-flown.lock.txt sbom.cdx.json"
        if [ -f site/index.html ]; then
          (cd site && python -m zipfile -c ../evidence-site.zip *) && assets="$assets evidence-site.zip"
        fi
        python tools/flown_baseline.py safety --repos "$GITHUB_REPOSITORY" "$OTHER_REPO" > safety.md
        {
          echo "Promotion of \`qa\` to \`master\` at $GITHUB_SHA ([CI run]($RUN_URL)), the flown baseline \`$TAG\`."
          echo
          cat pair.txt
          echo
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "**The test run for this commit did not pass.** It is published as a pre-release so the record exists; see the failing tests below."
            echo
          fi
          cat safety.md
          echo
          echo "### What flies"
          echo
          echo "\`requirements-flown.lock.txt\` is every Python package \`pip install \"$FLOWN\"\` resolved to for this commit (Linux x86_64, Python 3.12); \`sbom.cdx.json\` is the same environment as a CycloneDX SBOM."
          if [ -f records/tested-env.txt ]; then
            python tools/flown_baseline.py lockcheck --lock requirements-flown.lock.txt --tested records/tested-env.txt
          else
            echo "The build job left no record of its tested environment, so the lock is not checked against it."
          fi
          echo
          echo "### Test report"
          echo
          echo "Attached: \`verification.json\` and \`junit.xml\`, the test records."
          if [ -f evidence-site.zip ]; then
            echo "\`evidence-site.zip\` is the test-evidence page and the evidence-image index as rendered for this commit."
          else
            echo "The evidence-page job left no site for this run, so no \`evidence-site.zip\` is attached."
          fi
          echo
          python tools/verification_report.py summary records/verification.json
        } > notes.md
        if [ "$(wc -c < notes.md)" -gt 120000 ]; then
          head -c 118000 notes.md > notes.cut
          printf '\n\n_Report truncated to fit a release body; the full record is verification.json._\n' >> notes.cut
          mv notes.cut notes.md
        fi
        flags=""
        [ "$BUILD_RESULT" = "success" ] || flags="--prerelease"
        gh release create "$TAG" --verify-tag $flags \
          --title "Flown baseline $TAG ($short)" --notes-file notes.md $assets
