# Example primary flight display
PFD:
  include:
  - HMI_ENCODER_BUTTONS
  module: pyefis.screens.screenbuilder
  title: Screen Builder
  layout:
    #draw_grid: true
    rows: 110
    columns: 200
    display_state:
      interval: 3000
      states: 2
  instruments:
    - type: include,includes/ahrs/virtual_vfr.yaml
      row: 0
      column: 0
      span: 
        columns: 200
        rows: 45
    - type: include,includes/arcs/horizontal/four_wide_two_states_preferences_ARC1-8.yaml
      disabled: BUTTONS
      row: 45
      column: 0
      span:
        columns: 195.5
        rows: 15
    - type: include,includes/arcs/horizontal/four_wide_two_states_preferences_ARC1-8.yaml
      disabled: not BUTTONS
      row: 45
      column: 0
      span:
        columns: 195.5
        rows: 15
    - type: include,BUTTON_GROUP2
      disabled: BUTTONS 
      row: 100
      column: 0
    - type: include,includes/bars/vertical/six_wide_preferences_BAR1-6.yaml
      row: 60
      column: 0
      display_state: 1
      span:
        rows: 40   
        columns: 200
    - type: include,includes/mgl/v16/square-active-radio-display.yaml
      row: 60
      column: 0
      span:
        rows: 40
        columns: 200
      display_state: 2
      replace:
        radio_id: 1

    # Crew alerting marker (CAS3, CAP-119), as on pfd.yaml: the highest active
    # alert level, flashing while anything is unacknowledged; empty when
    # there is none. Touch to open the full list. Where the stock file
    # puts it on the attitude display (the top band, right of the autopilot
    # label, above the HSI heading box); the attitude display is squashed
    # here, so the box is too.
    - type: cas_marker
      row: 0.5
      column: 49
      span:
        rows: 2.5
        columns: 26
