# Navigation-data status screen (makerplane-data Phase F).
#
# Shows the currency of installed navigation data (airports, obstacles, ...)
# with a Continue button (always available) and an Update button (over-the-air;
# USB sticks are imported automatically by the updater's udev hook and show up
# on the next refresh).
#
# pyEfis always loads this screen but never boots to it: a click-through at
# boot would stand between the pilot and the PFD after an in-flight restart.
# The PFD data annunciation opens it. Continue returns to the normal flight
# screen (continue_screen, default PFD; set to the configured defaultScreen at
# startup).
DataStatus:
  module: pyefis.screens.screenbuilder
  title: Data Status
  layout:
    rows: 100
    columns: 100
  instruments:
    - type: data_status
      row: 0
      column: 0
      span:
        rows: 100
        columns: 100
      options:
        continue_screen: PFD
        # pyefis-data CLI path. An ABSOLUTE (or ~-prefixed) path is required
        # because pyEfis runs as a systemd service whose minimal PATH excludes
        # ~/.local/bin. A venv install is symlinked into ~/.local/bin.
        update_command: ~/.local/bin/pyefis-data
        # status_path defaults to ~/.makerplane/pyefis/status.json
