# Navigation-data status screen (makerplane-data Phase F).
#
# Shows the currency of installed navigation data (airports, obstacles, ...)
# with a Continue button (always available) and an Update button (over-the-air;
# USB sticks are imported automatically by the updater's udev hook and show up
# on the next refresh).
#
# To show this at boot, add this screen to your screen set and set
#   defaultScreen: DataStatus
# in the main config. Continue returns to the normal flight screen
# (continue_screen, default PFD).
DataStatus:
  module: pyefis.screens.screenbuilder
  title: Data Status
  layout:
    rows: 100
    columns: 100
  instruments:
    - type: data_status
      row: 0
      column: 0
      span:
        rows: 100
        columns: 100
      options:
        continue_screen: PFD
        # Path to the pyefis-data CLI on the Pi (venv install is symlinked
        # into ~/.local/bin). Override if installed elsewhere.
        update_command: pyefis-data
        # status_path defaults to ~/.makerplane/pyefis/status.json
