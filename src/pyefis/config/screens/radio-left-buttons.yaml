# This is a work in progress for a radio interface
# Eric plans to purchase an MGL V16 radio, once in hand 
# development on this feature will continue
RADIO:
  include:
  - HMI_ENCODER_BUTTONS
  module: pyefis.screens.screenbuilder
  title: Radio Screen
  layout:
    rows: 110
    columns: 200
    #draw_grid: true
  instruments:
    - type: value_text
      disabled: DEMO_TESTING_TEXT
      row: 103
      column: 30
      span:
        rows: 6
        columns: 60
      options:
        dbkey: MAVMSG
        font_percent: 0.9
    - type: include,includes/ahrs/virtual_vfr.yaml
      disabled: false
      row: 0
      column: 75
      span:
        rows: 70
        columns: 125
    - type: include,includes/arcs/vertical/four_high_two_states_preferences_ARC1-8.yaml
      disabled: BUTTONS
      row: 0
      column: 44.5
      span:
        rows: 70
        columns: 30
    - type: include,includes/arcs/vertical/four_high_two_states_preferences_ARC1-8.yaml
      disabled: not BUTTONS
      row: 0
      column: 37.5
      span:
        rows: 70
        columns: 37
    - type: include,includes/arcs/vertical/four_high_one_state_preferences_ARC9-12.yaml
      disabled: BUTTONS
      row: 0
      column: 14.5
      span:
        rows: 70
        columns: 30
    - type: include,includes/arcs/vertical/four_high_one_state_preferences_ARC9-12.yaml
      disabled: not BUTTONS
      row: 0
      column: 0
      span:
        rows: 70
        columns: 37
    - type: include,BUTTON_GROUP1
      disabled: BUTTONS
      row: 0
      column: 0
    - type: include,includes/bars/vertical/six_wide_preferences_BAR1-6.yaml
      row: 70
      column: 155
    - type: include,RADIO_COMBINED
      replace:
        radio_id: 1 # {radio_id} is replaced anywhere it appears in the included config
                    # Maybe you have two radios COMACTTX{radio_id} -> COMACTTX1
      row: 71
      column: 0
    - type: include,RADIO_COMBINED
      disabled: true
      replace:
        radio_id: 2 # {radio_id} is replaced anywhere it appears in the included config
                    # Maybe you have two radios COMACTTX{radio_id} -> COMACTTX1
      row: 0
      column: 0
      span:
        rows: 18
        columns: 75

    # Crew alerting marker (CAS3, CAP-119), as on radio.yaml: the highest active
    # alert level, flashing while anything is unacknowledged; empty when
    # there is none. Touch to open the full list. Where the stock file
    # puts it on the attitude display (the top band, right of the autopilot
    # label, above the HSI heading box); same size.
    - type: cas_marker
      row: 1
      column: 113
      span:
        rows: 6
        columns: 20
