# AI-only PFD — full attitude indicator stack (virtual_vfr widget with SVS,
# airspeed/altitude tapes, VSI, HSI, wind display) at the full width of the
# display, without the engine-monitoring arcs/bars or the radio panel.
#
# Use this screen on hardware that's tight on CPU budget for SVS, or for
# focused SVS development / demos. To make it the default screen, set
#   defaultScreen: PFD_AI_ONLY
# in your main.yaml.
PFD_AI_ONLY:
  include:
  - screens/virtualvfr_db.yaml
  - HMI_ENCODER_BUTTONS
  module: pyefis.screens.screenbuilder
  title: Screen Builder
  layout:
    rows: 110
    columns: 200
  instruments:
    # The AHRS bundle: virtual_vfr (attitude + SVS), tapes, VSI, HSI,
    # wind display. Same include the standard PFD uses — stretched to
    # the full display width since the engine/radio columns are gone.
    - type: include,includes/ahrs/virtual_vfr.yaml
      row: 0
      column: 0
      span:
        rows: 110
        columns: 200
