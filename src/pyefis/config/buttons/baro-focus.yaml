type: simple
text: "BARO"
dbkey: TSBTN{id}36
bg_color: "#101418"
fg_color: "#00ffff"
# Momentary: give the knob to the baro setting, as a touch on the altimeter
# tape's baro box does (TESS2). Nothing happens if no value on the showing
# screen edits it.
conditions:
  - when: "CLICKED eq true"
    actions:
      - focus: BARO
